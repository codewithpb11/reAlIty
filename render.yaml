services:
  - type: web
    name: reality-detector-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p model_cache
      HF_HOME=./model_cache python -c "from huggingface_hub import snapshot_download; snapshot_download('pb11-x/reality-detector-model')"
    startCommand: uvicorn webapp.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_TOKEN
        generateValue: false
      - key: HF_HOME
        value: ./model_cache
      - key: TRANSFORMERS_CACHE
        value: ./model_cache
